name: "build"

on:
  push:
    branches:
      - test

jobs:
  build:
    name: "Build"
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install coreutils for macOS
        if: matrix.os == 'macos-latest'
        run: brew install coreutils

      - name: Install Zip
        if: matrix.os == 'windows-latest'
        run: choco install zip

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install libpcap on Ubuntu
        if: matrix.os == 'ubuntu-latest' || matrix.os == 'ubuntu-24.04-arm'
        run: |
          sudo apt-get update
          sudo apt-get install -y libpcap-dev

      - name: Install libpcap on macOS
        if: matrix.os == 'macos-latest'
        run: |
          brew update
          brew install libpcap

      - name: Install Npcap SDK on Windows
        if: matrix.os == 'windows-latest'
        run: |
          choco install wget --no-progress
          mkdir -p npcap
          wget "https://npcap.com/dist/npcap-sdk-1.13.zip"
          unzip npcap-sdk-1.13.zip -d npcap
        shell: bash

      # Npcap OEM is the only edition with a silent installer (/S). The download
      # link is private: it lives in the NPCAP_OEM_URL repository secret and must
      # never be written to this file or printed to the log.
      - name: Install Npcap OEM on Windows
        if: matrix.os == 'windows-latest'
        env:
          NPCAP_OEM_URL: ${{ secrets.NPCAP_OEM_URL }}
        run: |
          @echo off
          if "%NPCAP_OEM_URL%"=="" (
            echo ::error::The NPCAP_OEM_URL secret is not set
            exit /b 1
          )
          curl -sSfL "%NPCAP_OEM_URL%" --output "%RUNNER_TEMP%\npcap-oem.exe" || exit /b 1
          start /wait "" "%RUNNER_TEMP%\npcap-oem.exe" /S /winpcap_mode
          del "%RUNNER_TEMP%\npcap-oem.exe"
          if not exist C:\Windows\System32\Npcap\wpcap.dll (
            echo ::error::Npcap was not installed
            exit /b 1
          )
          xcopy /Y C:\Windows\System32\Npcap\*.dll C:\Windows\System32
          xcopy /Y C:\Windows\SysWOW64\Npcap\*.dll C:\Windows\SysWOW64
        shell: cmd

      - name: Submodule update
        run: git submodule update --init --recursive
        shell: bash

      - name: Build and Test (Windows)
        if: matrix.os == 'windows-latest'
        run: |
          ls "$(pwd)/npcap"
          PCAP_ROOT="$(pwd)/npcap" npm i
          PCAP_ROOT="$(pwd)/npcap" npm run build
          node --test test/liveDevice.test.js test/arpTable.test.js test/routing.test.js
        shell: bash

      - name: Build and Test
        if: matrix.os != 'windows-latest'
        run: |
          npm i
          npm run build
          npm run test
        shell: bash

      - name: Prebuild (Windows)
        if: matrix.os == 'windows-latest'
        run: |
          ls "$(pwd)/npcap"
          PCAP_ROOT="$(pwd)/npcap" npm run precompile
          ls prebuilds
          zip -r prebuilds-${{ matrix.os }}.zip prebuilds
        shell: bash

      - name: Prebuild
        if: matrix.os != 'windows-latest'
        run: |
          npm run precompile
          ls prebuilds
        shell: bash

      - name: ls
        run: ls
        shell: bash

  alpine:
    name: "Build Alpine"
    strategy:
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Submodule update
        run: git submodule update --init --recursive
        shell: bash

      - name: Prebuild
        run: |
          docker buildx build . --output prebuilds
          ls prebuilds
